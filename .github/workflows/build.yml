name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
      - release/*

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  WEB_PROJECT_PATH: src/SvgToXaml.Web/SvgToXaml.Web.csproj
  DESKTOP_PROJECT_PATH: src/SvgToXaml.Desktop/SvgToXaml.Desktop.csproj
  DESKTOP_TARGET_FRAMEWORK: net10.0

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Validate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore browser workloads
        run: dotnet workload restore ${{ env.WEB_PROJECT_PATH }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test unit coverage
        run: dotnet test tests/SvgToXamlConverter.UnitTests/SvgToXamlConverter.UnitTests.csproj -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

  pack:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack NuGet packages
        run: |
          mkdir -p artifacts/packages
          for project in \
            src/SvgToXaml.Model/SvgToXaml.Model.csproj \
            src/SvgToXaml.Converter/SvgToXaml.Converter.csproj \
            src/SvgToXaml.Build/SvgToXaml.Build.csproj \
            src/svgxaml/svgxaml.csproj
          do
            dotnet pack "$project" -c Release -o artifacts/packages
          done

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish-desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish desktop app
        run: dotnet publish ${{ env.DESKTOP_PROJECT_PATH }} -c Release -f ${{ env.DESKTOP_TARGET_FRAMEWORK }} -r ${{ matrix.rid }} --self-contained true -o artifacts/publish/${{ matrix.rid }}

      - name: Archive publish output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/release/SvgToXaml.Desktop-${{ matrix.rid }}.zip" -Force

      - name: Archive publish output (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts/release
          tar -C artifacts/publish -czf artifacts/release/SvgToXaml.Desktop-${{ matrix.rid }}.tar.gz ${{ matrix.rid }}

      - name: Upload desktop publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
