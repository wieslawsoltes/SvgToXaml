name: azure-compatibility-shim

trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: none

  - script: |
      echo "Azure DevOps CI has been replaced by GitHub Actions."
      echo "Use the workflows under .github/workflows/ for validation, packaging, and releases."
    displayName: 'GitHub Actions migration notice'
